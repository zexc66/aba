<!doctype html>
<html>
<head><meta charset="utf-8"><title>scroll-probe</title><style>body{margin:0}</style></head>
<body>
<iframe id="f" src="/" style="width:1440px;height:1100px;border:0"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const sel = params.get("el") || "#programs";
  const f = document.getElementById("f");
  const scroll = () => {
    try {
      const d = f.contentDocument;
      const el = d.querySelector(sel);
      if (el) {
        const w = f.contentWindow;
        w.scrollTo({ top: el.getBoundingClientRect().top + w.scrollY - 90, behavior: "instant" });
        document.title = "SCROLLED";
      }
    } catch (e) { document.title = "ERR"; }
  };
  f.onload = () => { setTimeout(scroll, 2500); setTimeout(scroll, 5000); };
</script>
</body>
</html>
